[route]
; Ordner unter routes/, gebaut mit route.py
name="taunus"

[world]
; Uhrzeit verschieben in Stunden (z.B. 12 = Nachtfahrt am Tag). 0 = echte Zeit am Ort der Strecke
time_shift_hours=0.0
; Gras-Raster um den Fahrer (Büschel pro Kante, 220 = ~44 m Radius). Kleiner = schneller, 0 = aus
grass=220
; Monat für die Schneegrenze (1-12), 0 = echtes Datum. Schnee liegt, wo das Monatsmittel am Ort unter 0 °C ist
month=0

[rider]
name="Julian"
; Fahrer + Rad in kg, bestimmt das Tempo am Berg
mass=89.0
; Wie stark Steigungen an den Kickr gehen (Zwift-Standard: 0.5)
difficulty=0.5
; Prozentpunkte Steigung pro virtuellem Gang
gear_step=1.0
; FTP in Watt: Zielleistung der Workouts (Startbildschirm merkt sich den zuletzt eingestellten Wert)
ftp=250.0

[net]
; IP des Kollegen (z.B. Tailscale-IP). Leer = alleine fahren.
peer_host=""
port=47810
